# One tracked table of every university an instance key can name. `INSTANCE_KEY` in
# `config/web.toml` selects one entry, and the entry order is the setup menu order.
# Each entry carries exactly one source block, and each period is a start year with its
# exclusive end year. An entry may also set `inference_target_fields` and
# `inference_pool_fields`, each an array of official text field names in canonical order. An
# entry that omits them uses the name, content, outcomes and prerequisite-text target and the
# name, content and outcomes pool.
# `study_plan_script` names the import script, `sisu` or `peppi`, and `study_plan_formats`
# names the formats the site offers. A Sisu source family accepts
# `sisu_page`, `sisu_pdf` and `sisu_capture`. A Peppi source family accepts `peppi_page` and
# `peppi_capture`. A configured script requires its platform's capture format, and a capture
# format requires its script.

