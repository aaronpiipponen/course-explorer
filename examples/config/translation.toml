# Portable translation worker runtime/provenance contract plus the remote translation-controller
# state-root/health policy values, validated by course_explorer.config TranslationSettings and
# TranslationControllerSettings. The neutral SSH connect timeout lives in config/worker.toml. The
# translation state root holds current/state.json plus one session receipt directory per session.
TRANSLATION_HOST = "127.0.0.1"
TRANSLATION_PORT = 18081
TRANSLATION_MODEL_ALIAS = "translategemma-12b-it"
TRANSLATION_MODEL_REPOSITORY = "google/translategemma-12b-it"
TRANSLATION_MODEL_REVISION = "d1b225e1caa17f1ddc7e62065d8637d0923f34e2"
# Published artifact source. The three keys name the repository, revision and GGUF file of a
# published conversion, and the install downloads a missing file from the URL they derive. All
# three keys are absent when the artifact is a local conversion.
TRANSLATION_ARTIFACT_REPOSITORY = "mradermacher/translategemma-12b-it-GGUF"
TRANSLATION_ARTIFACT_REVISION = "41d7c8aa650b26791225ad9d0597e674e680da96"
TRANSLATION_ARTIFACT_FILE = "translategemma-12b-it.Q5_K_M.gguf"
TRANSLATION_ARTIFACT_PATH = "models/translategemma-12b-it-Q5_K_M-41d7c8aa/translategemma-12b-it.Q5_K_M.gguf"
TRANSLATION_ARTIFACT_SHA256 = "be458d9ab099e0f418bc5687c5e97cf1555c3d32a012a196744db917656becbc"
TRANSLATION_ARTIFACT_QUANT = "Q5_K_M"
TRANSLATION_RUNTIME_REVISION = "bb02f74c612064947e51d23269a1cf810b67c9a7"
TRANSLATION_CONTEXT_SIZE = 16384
TRANSLATION_PARALLEL = 1
TRANSLATION_GPU_LAYERS = "all"
TRANSLATION_REQUEST_TIMEOUT_SECONDS = 600
TRANSLATION_MAX_ATTEMPTS = 3
TRANSLATION_RETRY_BACKOFF_SECONDS = 1
TRANSLATION_MAX_TOKENS = 8192
TRANSLATION_TEMPERATURE = 0
TRANSLATION_CONTROLLER_STATE_ROOT = "data/translations/controller"
TRANSLATION_CONTROLLER_HEALTH_ATTEMPTS = 120
# Shared wait values for both worker stages, in seconds. The health interval is the poll interval
# between status reads (above zero, at most 30). The stop timeout bounds one stop and its
# acknowledgement (above zero, at most 3600).
WORKER_HEALTH_INTERVAL_SECONDS = 2
WORKER_STOP_TIMEOUT_SECONDS = 660
