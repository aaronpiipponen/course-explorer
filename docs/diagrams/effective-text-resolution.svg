<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Resolution of one teaching-text field and language</title>
  <desc id="d">The flow resolves one field and one configured language of a representative version. A
  non-blank official value is effective text as it stands. Otherwise a stored translation
  participates only when its target is mapped and its source is listed for that target, so an
  accepted translation is the only translation that can become effective text. An accepted
  translation is effective when the official text of the same field in its source language hashes to
  the recorded source hash. An accepted translation whose recorded source hash differs is reported
  as stale and yields no effective text, and a cell with no accepted translation yields no effective
  text.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="592" rx="12" fill="#232434"/>

  <rect x="350" y="48" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="74" text-anchor="middle" font-size="16" fill="#ececf2">One field and language</text>
  <text x="480" y="96" text-anchor="middle" font-size="14" fill="#a3a4b8">of a representative version</text>

  <rect x="350" y="152" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="178" text-anchor="middle" font-size="16" fill="#ececf2">Official text</text>
  <text x="480" y="200" text-anchor="middle" font-size="14" fill="#a3a4b8">present?</text>

  <rect x="48" y="272" width="260" height="64" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="178" y="298" text-anchor="middle" font-size="16" fill="#ececf2">Official text</text>
  <text x="178" y="320" text-anchor="middle" font-size="14" fill="#a3a4b8">is effective</text>

  <rect x="350" y="272" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="298" text-anchor="middle" font-size="16" fill="#ececf2">An accepted translation</text>
  <text x="480" y="320" text-anchor="middle" font-size="14" fill="#a3a4b8">is stored?</text>

  <rect x="350" y="384" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="410" text-anchor="middle" font-size="16" fill="#ececf2">Recorded source</text>
  <text x="480" y="432" text-anchor="middle" font-size="14" fill="#a3a4b8">hash matches?</text>

  <rect x="48" y="496" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="178" y="522" text-anchor="middle" font-size="16" fill="#ececf2">The translation</text>
  <text x="178" y="544" text-anchor="middle" font-size="14" fill="#a3a4b8">is effective</text>

  <rect x="350" y="496" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="522" text-anchor="middle" font-size="16" fill="#ececf2">Stale translation</text>
  <text x="480" y="544" text-anchor="middle" font-size="14" fill="#a3a4b8">reported, not used</text>

  <rect x="652" y="384" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="782" y="410" text-anchor="middle" font-size="16" fill="#ececf2">No effective text</text>
  <text x="782" y="432" text-anchor="middle" font-size="14" fill="#a3a4b8">for this cell</text>

  <line x1="480" y1="112" x2="480" y2="152" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="350,184 178,184 178,272" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="262" y="176" text-anchor="end" font-size="14" fill="#a3a4b8">Yes</text>

  <line x1="480" y1="216" x2="480" y2="272" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="492" y="248" font-size="14" fill="#a3a4b8">No</text>

  <line x1="480" y1="336" x2="480" y2="384" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="492" y="364" font-size="14" fill="#a3a4b8">Yes</text>

  <polyline points="610,304 782,304 782,384" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="296" text-anchor="middle" font-size="14" fill="#a3a4b8">No</text>

  <polyline points="350,416 178,416 178,496" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="262" y="408" text-anchor="end" font-size="14" fill="#a3a4b8">Yes</text>

  <line x1="480" y1="448" x2="480" y2="496" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="492" y="476" font-size="14" fill="#a3a4b8">No</text>
</svg>
