<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">System context of course-explorer</title>
  <desc id="d">The read-only side, drawn as one accent frame, holds the browser app and the web server,
  and the machine-wide site proxy sits beside it in its own Compose project. The browser app sends
  each site request to the web server, and in domain mode the request passes through the proxy,
  drawn dashed. The web server reads the Selected dataset from the PostgreSQL database with pgvector,
  embeds query text through the embedding service and writes submissions to the feedback application
  store, and the feedback sender publishes from that store. The administration surface frames the
  administration console and the administration backend, and the backend runs fixed commands
  through the administration command. The administration command captures the public curriculum source, writes
  the Working dataset and hands a copy to the worker, a separate host or the same-machine
  container.</desc>
