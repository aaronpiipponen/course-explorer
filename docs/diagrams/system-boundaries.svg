<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Boundaries between the read-only side and the administration side</title>
  <desc id="d">An administration side holds the administration console, the administration backend,
  the administration command and the worker, a separate host or the same-machine container. A
  read-only side, outlined in accent, holds the browser app and the web server. A database between
  the two sides holds the Selected and Working datasets: the administration command writes Working,
  and the web server reads Selected. A feedback application store holds the submissions the web
  server writes and the administration command lists and deletes, and the feedback sender claims and
  records them. A usage file holds the request records that the web server appends and the
  administration command reads and prunes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="12" fill="#232434"/>

  <rect x="24" y="64" width="392" height="448" rx="12" fill="none"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="40" y="88" font-size="16" fill="#a3a4b8">Administration side</text>

  <rect x="764" y="64" width="172" height="232" rx="12" fill="none"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="780" y="88" font-size="16" fill="#a98ae0">Read-only side</text>

  <rect x="40" y="104" width="352" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="216" y="130" text-anchor="middle" font-size="16" fill="#ececf2">Administration console</text>
  <text x="216" y="152" text-anchor="middle" font-size="14" fill="#a3a4b8">Signed-in browser app</text>

  <rect x="40" y="200" width="352" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="216" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Administration backend</text>
  <text x="216" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">Commands and sessions</text>

  <rect x="40" y="296" width="352" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="216" y="322" text-anchor="middle" font-size="16" fill="#ececf2">Administration command</text>
  <text x="216" y="344" text-anchor="middle" font-size="14" fill="#a3a4b8">Operator menu and stages</text>

  <rect x="40" y="424" width="360" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="220" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Worker</text>
  <text x="220" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">Separate host or same-machine container</text>

  <rect x="776" y="104" width="144" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="848" y="130" text-anchor="middle" font-size="16" fill="#ececf2">Browser app</text>
  <text x="848" y="152" text-anchor="middle" font-size="14" fill="#a3a4b8">Browser state</text>

  <rect x="776" y="216" width="144" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="848" y="242" text-anchor="middle" font-size="16" fill="#ececf2">Web server</text>
  <text x="848" y="264" text-anchor="middle" font-size="14" fill="#a3a4b8">Read-only API</text>

  <rect x="456" y="184" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="600" y="210" text-anchor="middle" font-size="16" fill="#ececf2">Database</text>
  <text x="600" y="232" text-anchor="middle" font-size="14" fill="#a3a4b8">Selected and Working datasets</text>

  <rect x="456" y="400" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="600" y="426" text-anchor="middle" font-size="16" fill="#ececf2">Feedback application store</text>
  <text x="600" y="448" text-anchor="middle" font-size="14" fill="#a3a4b8">Submissions and outcomes</text>

  <rect x="456" y="496" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="600" y="522" text-anchor="middle" font-size="16" fill="#ececf2">Feedback sender</text>
  <text x="600" y="544" text-anchor="middle" font-size="14" fill="#a3a4b8">Scheduled publication</text>

  <rect x="776" y="544" width="160" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="856" y="570" text-anchor="middle" font-size="16" fill="#ececf2">Usage file</text>
  <text x="856" y="592" text-anchor="middle" font-size="14" fill="#a3a4b8">Request records</text>

  <line x1="216" y1="168" x2="216" y2="200" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="228" y="190" font-size="14" fill="#a3a4b8">Requests</text>

  <line x1="216" y1="264" x2="216" y2="296" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="204" y="286" text-anchor="end" font-size="14" fill="#a3a4b8">Fixed commands</text>

  <line x1="216" y1="360" x2="216" y2="424" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="228" y="400" font-size="14" fill="#a3a4b8">Remote stages</text>

  <line x1="902" y1="168" x2="902" y2="216" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="894" y="206" text-anchor="end" font-size="14" fill="#a3a4b8">App requests</text>

  <polyline points="250,296 250,284 560,284 560,248" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="552" y="267" text-anchor="end" font-size="14" fill="#a3a4b8">Writes Working</text>

  <polyline points="392,310 448,310 448,432 456,432" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="456" y="380" font-size="14" fill="#a3a4b8">Lists and deletes</text>

  <polyline points="392,342 428,342 428,576 776,576" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="436" y="484" font-size="14" fill="#a3a4b8">Reads and prunes</text>

  <polyline points="784,216 784,176 600,176 600,184" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="164" text-anchor="end" font-size="14" fill="#a3a4b8">Reads Selected</text>

  <polyline points="860,280 860,432 744,432" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="752" y="452" font-size="14" fill="#a3a4b8">Submissions</text>

  <polyline points="900,280 900,544" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="890" y="500" text-anchor="end" font-size="14" fill="#a3a4b8">Appends</text>

  <line x1="600" y1="496" x2="600" y2="464" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="612" y="484" font-size="14" fill="#a3a4b8">Claims and records</text>
</svg>
