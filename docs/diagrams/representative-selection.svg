<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Representative version selection</title>
  <desc id="d">Every version of one course is checked for a curriculum-period membership year at or
  before the current academic year. A version listed only after the current academic year has no such
  year and takes part in neither ranking. When a version has one, the candidates keep each version's greatest
  eligible year and are ordered by the current academic year, then by the greatest year inside the
  activity window, then by the greatest earlier year, with ties broken by the greater source
  modification ordinal and then the greatest exact source version identity. When no version has such
  a year, the versions with no membership at all are ranked by the greater source modification
  ordinal and then the greatest exact source version identity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="576" rx="12" fill="#232434"/>

  <rect x="48" y="48" width="400" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="248" y="74" text-anchor="middle" font-size="16" fill="#ececf2">Versions of one course</text>

  <rect x="48" y="120" width="400" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="248" y="146" text-anchor="middle" font-size="16" fill="#ececf2">Any eligible dated listing?</text>
  <text x="248" y="168" text-anchor="middle" font-size="14" fill="#a3a4b8">a future-only listing has none</text>

  <rect x="48" y="216" width="400" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="248" y="242" text-anchor="middle" font-size="16" fill="#ececf2">Keep each version's greatest</text>
  <text x="248" y="264" text-anchor="middle" font-size="14" fill="#a3a4b8">eligible year</text>

  <rect x="48" y="312" width="400" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="248" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Prefer the configured year</text>
  <text x="248" y="360" text-anchor="middle" font-size="14" fill="#a3a4b8">then the window, then earlier years</text>

  <rect x="48" y="408" width="400" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="248" y="434" text-anchor="middle" font-size="16" fill="#ececf2">Break ties deterministically</text>
  <text x="248" y="456" text-anchor="middle" font-size="14" fill="#a3a4b8">greater ordinal, then version id</text>

  <rect x="48" y="504" width="400" height="40" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="248" y="530" text-anchor="middle" font-size="16" fill="#ececf2">The representative version</text>

  <rect x="520" y="216" width="392" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="716" y="242" text-anchor="middle" font-size="16" fill="#ececf2">Keep the membership-free versions</text>
  <text x="716" y="264" text-anchor="middle" font-size="14" fill="#a3a4b8">when no version has one</text>

  <rect x="520" y="312" width="392" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="716" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Rank by ordinal</text>
  <text x="716" y="360" text-anchor="middle" font-size="14" fill="#a3a4b8">then by the source version id</text>

  <line x1="248" y1="88" x2="248" y2="120" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="184" x2="248" y2="216" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="204" font-size="14" fill="#a3a4b8">Yes</text>
  <line x1="248" y1="280" x2="248" y2="312" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="376" x2="248" y2="408" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="472" x2="248" y2="504" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="448,152 492,152 492,248 520,248" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="458" y="142" font-size="14" fill="#a3a4b8">No</text>

  <line x1="716" y1="280" x2="716" y2="312" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="716,376 716,524 448,524" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="516" font-size="14" fill="#a3a4b8">fallback</text>
</svg>
