<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Inference text policies</title>
  <desc id="d">Effective text supplies embedding readiness, the packet's teaching cells, and the prompt
  cells, which also take selected official non-teaching cells. The dashed arrow shows the inference
  policy selecting the cells inside the label-safe boundary. The teaching cells feed retrieval and the
  rerank, the prompt cells feed the prompt, and the official prerequisite structure reaches only the
  proposal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="680" rx="12" fill="#232434"/>

  <rect x="344" y="184" width="272" height="208" rx="8" fill="none" stroke="#a98ae0"
        stroke-width="1.5"/>
  <text x="348" y="176" font-size="16" fill="#a3a4b8">Label-safe inputs</text>

  <rect x="40" y="88" width="240" height="96" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="160" y="132" text-anchor="middle" font-size="16" fill="#ececf2">Effective text</text>
  <text x="160" y="154" text-anchor="middle" font-size="14" fill="#a3a4b8">Every course</text>

  <rect x="360" y="72" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="98" text-anchor="middle" font-size="16" fill="#ececf2">Embedding readiness</text>
  <text x="480" y="120" text-anchor="middle" font-size="14" fill="#a3a4b8">Full effective text</text>

  <rect x="360" y="200" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Teaching cells</text>
  <text x="480" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">In the packet</text>

  <rect x="680" y="200" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="800" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Retrieval and rerank</text>
  <text x="800" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">From the packet</text>

  <rect x="360" y="312" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Prompt cells</text>
  <text x="480" y="360" text-anchor="middle" font-size="14"
        fill="#a3a4b8">Effective and official</text>

  <rect x="680" y="312" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="800" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Prompt</text>
  <text x="800" y="360" text-anchor="middle" font-size="14" fill="#a3a4b8">Model input</text>

  <rect x="40" y="312" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="160" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Inference policy</text>
  <text x="160" y="360" text-anchor="middle" font-size="14"
        fill="#a3a4b8">Pairs and prompt fields</text>

  <rect x="40" y="408" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="160" y="434" text-anchor="middle" font-size="16" fill="#ececf2">Official text</text>
  <text x="160" y="456" text-anchor="middle" font-size="14"
        fill="#a3a4b8">Non-teaching fields</text>

  <rect x="40" y="504" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="160" y="530" text-anchor="middle" font-size="16"
        fill="#ececf2">Official prerequisite</text>
  <text x="160" y="552" text-anchor="middle" font-size="14" fill="#a3a4b8">Structure</text>

  <rect x="360" y="504" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="530" text-anchor="middle" font-size="16" fill="#ececf2">Proposal</text>
  <text x="480" y="552" text-anchor="middle" font-size="14"
        fill="#a3a4b8">After a result exists</text>

  <line x1="280" y1="104" x2="360" y2="104" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <polyline points="280,136 336,136 336,232 360,232" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="280,168 312,168 312,328 360,328" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="280,440 292,440 292,360 360,360" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="344" x2="344" y2="344" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="600" y1="232" x2="680" y2="232" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="600" y1="344" x2="680" y2="344" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="280" y1="536" x2="360" y2="536" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="40" y="600" width="320" height="48" rx="8" fill="none" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <line x1="56" y1="624" x2="96" y2="624" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="108" y="629" font-size="14" fill="#a3a4b8">The policy selects the cells</text>
</svg>
